
name: Update solar system

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solar-system-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate.py \
            --username Shadow-Monarch-33 \
            --output output/solar-system.svg \
            --comet-flight 9 \
            --comet-spacing 3.5 \
            --max-active-comets 3

      - name: Validate SVG
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          path = pathlib.Path("output/solar-system.svg")
          svg = path.read_text(encoding="utf-8")
          root = ET.fromstring(svg)
          lowered = svg.lower()

          forbidden = (
              "<script",
              "<foreignobject",
              "@import",
              "url(http",
              "xlink:href",
              "javascript:",
          )

          for item in forbidden:
              assert item not in lowered, item

          for node in root.iter():
              tag = node.tag.rsplit("}", 1)[-1]
              if tag == "image":
                  href = node.get("href") or ""
                  assert href.startswith("data:image/"), (
                      "External image detected"
                  )

          assert "ghp_" not in svg
          assert "github_pat_" not in svg

          print("SVG validated successfully")
          PY

      - name: Commit and push when changed
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME:-main}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/solar-system.svg

          if git diff --cached --quiet; then
            echo "No SVG changes to commit"
            exit 0
          fi

          git commit -m "chore: update solar system [skip ci]"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt of 3"

            git fetch origin "$branch"

            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              echo "::error::Rebase conflict; stopping safely"
              exit 1
            fi

            if git push origin "HEAD:$branch"; then
              echo "Successfully published updated SVG"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts"
              exit 1
            fi

            echo "Remote changed; retrying with latest branch"
          done
