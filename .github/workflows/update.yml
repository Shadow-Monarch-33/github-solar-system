
name: Update solar system

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solar-system-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOLAR_SYSTEM_TOKEN: ${{ secrets.SOLAR_SYSTEM_TOKEN }}
          SOLAR_SYSTEM_MODE: ${{ vars.SOLAR_SYSTEM_MODE || 'public' }}
        run: |
          MODE="${SOLAR_SYSTEM_MODE:-public}"
          if [ "$MODE" = "public" ] || [ "$MODE" = "both" ]; then
            python generate.py \
              --username Shadow-Monarch-33 \
              --mode public \
              --output output/solar-system-public.svg \
              --comet-flight 9 \
              --comet-spacing 3.5 \
              --max-active-comets 3
            cp output/solar-system-public.svg output/solar-system.svg
          fi

          if [ "$MODE" = "all" ] || [ "$MODE" = "both" ]; then
            if [ -z "$SOLAR_SYSTEM_TOKEN" ]; then
              if [ "$MODE" = "both" ]; then
                echo "warning: SOLAR_SYSTEM_TOKEN is not configured; skipping Complete Universe (output/solar-system-all.svg)" >&2
              else
                echo "error: SOLAR_SYSTEM_TOKEN is required when SOLAR_SYSTEM_MODE=all" >&2
                exit 1
              fi
            else
              python generate.py \
                --username Shadow-Monarch-33 \
                --mode all \
                --output output/solar-system-all.svg \
                --comet-flight 9 \
                --comet-spacing 3.5 \
                --max-active-comets 3
            fi
          fi

      - name: Validate SVG
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          paths = sorted(pathlib.Path("output").glob("solar-system*.svg"))
          if not paths:
              raise SystemExit("no solar-system*.svg outputs found")
          for path in paths:
              svg = path.read_text(encoding="utf-8")
              root = ET.fromstring(svg)
              lowered = svg.lower()

              forbidden = (
                  "<script",
                  "<foreignobject",
                  "@import",
                  "url(http",
                  "xlink:href",
                  "javascript:",
              )

              for item in forbidden:
                  assert item not in lowered, f"{path}: {item}"

              for node in root.iter():
                  tag = node.tag.rsplit("}", 1)[-1]
                  if tag == "image":
                      href = node.get("href") or ""
                      assert href.startswith("data:image/"), (
                          f"{path}: External image detected"
                      )

              assert "ghp_" not in svg, f"{path}: token leaked"
              assert "github_pat_" not in svg, f"{path}: token leaked"
              print(f"Validated {path}")
          PY

      - name: Commit and push when changed
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME:-main}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/solar-system*.svg

          if git diff --cached --quiet; then
            echo "No SVG changes to commit"
            exit 0
          fi

          git commit -m "chore: update solar system [skip ci]"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt of 3"

            git fetch origin "$branch"

            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              echo "::error::Rebase conflict; stopping safely"
              exit 1
            fi

            if git push origin "HEAD:$branch"; then
              echo "Successfully published updated SVG"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts"
              exit 1
            fi

            echo "Remote changed; retrying with latest branch"
          done
